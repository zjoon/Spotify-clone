<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyStream - Modern Music Player</title>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

<body>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <div class="flex calsses"> <i class="ri-music-2-line"></i>
        <div class="hamburger"><i class="ri-menu-line"></i></div> <i class=" transform ri-circle-fill"></i>
    </div> <i class=" transform ri-home-5-fill"></i>
    <div class="section2">
        <div class="search"> <i class="ri-search-2-line"></i> <input type="text"
                placeholder="What do you want to listen today?"> </div>
        <div class="standing-line"> <i class="ri-folder-open-line"></i> </div>
    </div>
    <div class="f">
        <div class="navbtns">
            <ul>
                <li> Premium </li>
                <li> Support </li>
                <li> Download </li>
            </ul>
        </div>
        <div class="standing-line2"></div>
        <div class="buttons"> <button class="btn1"> <i class="btn1 ri-arrow-down-circle-line"></i> Install App</button>
            <button class="btn2">Sign up</button> <button class="btn3">Log in </button>
        </div>
    </div>
    <div class="container">
        <div class=" box1">
            <h2> Your Library </h2> <i class="ri-add-fill"></i> <i class="ri-close-line"></i>
            <div class="music"> </div>
            <div class="footer"> Legal &nbsp; Safety & Privacy Center &nbsp; &nbsp; Privacy Policy &nbsp; Cookies &nbsp;
                About Ads&nbsp; Accessibility <div> Cookies</div>
                <class class="btn"> <i class="ri-global-line"></i>English</class>
            </div>
        </div>
        <div class="box2">
            <h2>Trending songs</h2>
            <div class="cards"> </div>
            <div class="player">
                <div class="musicplayer">
                    <div class="p">
                        <div class=" songinfo"></div>
                        <div class="bts"> <i id="prev" class="ri-skip-back-line"></i> <i id="playbtn"
                                class="ri-play-circle-line"></i> <i id="next" class="ri-skip-forward-line"></i> </div>
                        <div class=" songtime"></div>
                        <div class="range"> <i class="ri-volume-up-line"></i> <input type="range" name="volume"> </div>
                    </div>
                    <nav class=" seekbar"><i id="circle" class="ri-checkbox-blank-circle-fill"></i></nav>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
